<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progress Bar</title>

    <link
        rel="stylesheet"
        href="style_cw.css"
    >

</head>


<body>


<header>

    <nav>

        <a href="index.html">

            <div class="logo">
                DS
            </div>

        </a>

    </nav>


    <nav>

        <a href="index.html">
            Главная
        </a>

        <a href="last_upd.html">
            Последнее нововведение
        </a>

        <a href="#foot">
            Соцсети
        </a>

    </nav>


    <div class="header-buttons" id="headerButtons">

        <button 
            onclick="window.location.href='login.html'" 
            class="light">
            Войти
        </button>

        <button 
            onclick="window.location.href='register.html'" 
            class="dark">
            Зарегистрироваться
        </button>

    </div>

</header>



<section class="hero">

    <h1>
        Работа над игрой
    </h1>

</section>



<section class="progress">

    <h2>
        Прогресс разработки
    </h2>


    <div class="cards">


        <!-- ПРОГРАММИРОВАНИЕ -->

        <div
            class="card"
            data-area="Код"
        >

            <img
                class="prog-img"
                src="img/photo_5307862658079987073_y.jpg"
                alt=""
            >


            <div>

                <h3>
                    Программирование
                </h3>

                <p>
                    Программная часть игры.
                </p>


                <div class="progress_bar">

                    <div class="progress_background">

                        <div class="line"></div>

                    </div>


                    <span class="progress_percent">
                        0%
                    </span>

                </div>

            </div>

        </div>



        <!-- ГРАФИКА -->

        <div
            class="card"
            data-area="Графика"
        >

            <img
                class="prog-img"
                src="img/photo_5307862658079987073_y.jpg"
                alt=""
            >


            <div>

                <h3>
                    Графика
                </h3>

                <p>
                    Графическая часть игры.
                </p>


                <div class="progress_bar">

                    <div class="progress_background">

                        <div class="line"></div>

                    </div>


                    <span class="progress_percent">
                        0%
                    </span>

                </div>

            </div>

        </div>



        <!-- СЮЖЕТ -->

        <div
            class="card"
            data-area="Сюжет"
        >

            <img
                class="prog-img"
                src="img/photo_5307862658079987073_y.jpg"
                alt=""
            >


            <div>

                <h3>
                    Сюжет
                </h3>

                <p>
                    Сюжетная часть игры.
                </p>


                <div class="progress_bar">

                    <div class="progress_background">

                        <div class="line"></div>

                    </div>


                    <span class="progress_percent">
                        0%
                    </span>

                </div>

            </div>

        </div>


    </div>

</section>



<footer>

    <nav>

        <a href="#top">

            <div class="logo">
                DS
            </div>

        </a>

    </nav>


    <nav class="column">

        <a id="foot">
            Соцсети
        </a>

        <a href="#">
            Ссылка на Steam
        </a>

    </nav>

</footer>



<script src="current_work.js"></script>


</body>

</html>
