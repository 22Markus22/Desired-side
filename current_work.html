<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="style_cw.css">
</head>

<script src="auth.js"></script>
<script>
(async()=>{
const user=await currentUser();
if(!user)
    return;
document.getElementById("headerButtons").innerHTML=`
<span style="padding-top:9px">
${user.username}
</span>
<button class="dark"
onclick="logout()">
Выйти
</button>
`;
})();
</script>
<script src="current_work.js"></script>

<body>

<header>
    <nav>
    <a href="index.html"> <div class="logo">DS</div> </a>
    </nav>
    <nav>
        <a href="index.html">Главная</a>
        <a href="last_upd.html">Последнее нововведение</a>
        <a href="#foot">Соцсети</a>
    </nav>
        <div class="header-buttons" id="headerButtons">
        <button class="light"
        onclick="location.href='login.html'">
        Войти
        </button>
        <button class="dark"
        onclick="location.href='register.html'">
        Регистрация
        </button>
        </div>
</header>

<section class="hero">
    <h1>Работа над игрой</h1>
</section>

<section class="progress">

    <h2>Прогресс разработки</h2>

    <div class="cards">

        <div class="card" data-area="Программирование">

            <img
                class="prog-img"
                src="img/photo_5307862658079987073_y.jpg"
                alt=""
            >

            <div>

                <h3>Программирование</h3>

                <p>
                    Программная часть игры.
                </p>

                <div class="progress_bar">
                    <div class="progress_background">
                        <div class="line"></div>
                    </div>
                </div>

                <span class="progress_percent">
                    0%
                </span>

            </div>

        </div>


        <div class="card" data-area="Графика">

            <img
                class="prog-img"
                src="img/photo_5307862658079987073_y.jpg"
                alt=""
            >

            <div>

                <h3>Графика</h3>

                <p>
                    Графическая часть игры.
                </p>

                <div class="progress_bar">
                    <div class="progress_background">
                        <div class="line"></div>
                    </div>
                </div>

                <span class="progress_percent">
                    0%
                </span>

            </div>

        </div>


        <div class="card" data-area="Сюжет">

            <img
                class="prog-img"
                src="img/photo_5307862658079987073_y.jpg"
                alt=""
            >

            <div>

                <h3>Сюжет</h3>

                <p>
                    Сюжетная часть игры.
                </p>

                <div class="progress_bar">
                    <div class="progress_background">
                        <div class="line"></div>
                    </div>
                </div>

                <span class="progress_percent">
                    0%
                </span>

            </div>

        </div>

    </div>

</section>

<footer>
    <nav>
    <a href="#top"> <div class="logo">DS</div> </a>
    </nav>
    <nav class="column">
        <a id="foot">Соцсети</a>
        <a href="#">Ссылка на Steam</a>
    </nav>
</footer>

</body>
</html>
