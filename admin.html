<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
    <style>
.admin-page{
    width:min(900px,90%);
    margin:50px auto;
}

.admin-form{
    background:#fff;
    border:1px solid #ddd;
    padding:25px;
    margin-bottom:35px;
}

.admin-form h1{
    margin-bottom:20px;
    font-size:clamp(26px, 5vw, 36px);
}

.admin-form input,
.admin-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    font-family:Arial,sans-serif;
}

.admin-form textarea{
    min-height:180px;
    resize:vertical;
}

.post-admin{
    background:#fff;
    border:1px solid #ddd;
    padding:20px;
    margin-bottom:15px;
    overflow-wrap:anywhere;
}

.post-admin h3{
    margin-bottom:8px;
}

.post-admin p{
    color:#666;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.post-actions{
    margin-top:15px;
}

.danger{
    background:#b42318;
    color:#fff;
}

.danger:hover{
    background:#8f1c13;
}

.error{
    color:#b42318;
    margin-bottom:15px;
}

@media (max-width:768px){

    .admin-page{
        width:92%;
        margin:30px auto;
    }

    .admin-form{
        padding:20px;
        margin-bottom:25px;
    }

    .admin-form textarea{
        min-height:150px;
    }

    .post-admin{
        padding:15px;
    }

}

@media (max-width:480px){

    .admin-page{
        width:94%;
        margin:20px auto;
    }

    .admin-form{
        padding:15px;
    }

    .admin-form input,
    .admin-form textarea{
        font-size:16px;
    }

    .post-actions button{
        width:100%;
    }

}
</style>
</head>
<body>

<header>
    <div class="logo">DS</div>
    <nav>
        <a href="index.html">Главная</a>
        <a href="last_upd.html">Последние нововведения</a>
        <a href="current_work.html">Текущий этап разработки</a>
    </nav>
</header>

<main class="admin-page" id="adminPage">
    <div class="admin-form">
        <h1>Создание нововведения</h1>
        <p id="error" class="error"></p>

        <input id="title" type="text" placeholder="Заголовок">
        <textarea id="content" placeholder="Текст нововведения"></textarea>

        <button class="dark" onclick="createPost()">Опубликовать</button>
    </div>

    <h2>Опубликованные посты</h2>
    <div id="adminPosts"></div>
</main>

<script src="auth.js"></script>
<script>
async function initAdmin() {

    const user = await currentUser();

    if (!user || user.role !== "admin") {
        document.getElementById("adminPage").innerHTML = `
            <h1>Доступ запрещен</h1>
            <p>Эта страница доступна только администраторам.</p>
        `;
        return;
    }

    loadAdminPosts();
}

async function createPost() {

    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const error = document.getElementById("error");

    error.textContent = "";

    if (!title || !content) {
        error.textContent = "Заполните оба поля.";
        return;
    }

    const response = await fetch("/api/posts", {
        method:"POST",
        credentials:"include",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({title,content})
    });

    const data = await response.json();

    if (!response.ok) {
        error.textContent = data.message || "Ошибка создания поста.";
        return;
    }

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";

    loadAdminPosts();
}

async function loadAdminPosts() {

    const response = await fetch("/api/posts", {cache:"no-store"});
    const posts = await response.json();
    const container = document.getElementById("adminPosts");

    if (posts.length === 0) {
        container.innerHTML = "<p>Постов пока нет.</p>";
        return;
    }

    container.innerHTML = posts.map(post => `
        <article class="post-admin">
            <h3>${escapeHtml(post.title)}</h3>
            <p>${escapeHtml(post.content)}</p>
            <div class="post-actions">
                <button class="danger" onclick="deletePost(${post.id})">Удалить</button>
            </div>
        </article>
    `).join("");
}

async function deletePost(id) {

    if (!confirm("Удалить этот пост?"))
        return;

    const response = await fetch(`/api/posts/${id}`, {
        method:"DELETE",
        credentials:"include"
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.message || "Ошибка удаления");
        return;
    }

    loadAdminPosts();
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

initAdmin();
</script>
</body>
</html>
