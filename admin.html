<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
    <style>
.admin-page{
    width:min(900px,90%);
    margin:50px auto;
}

.admin-form{
    background:#fff;
    border:1px solid #ddd;
    padding:25px;
    margin-bottom:35px;
}

.admin-form h1{
    margin-bottom:20px;
    font-size:clamp(26px, 5vw, 36px);
}

.admin-form input,
.admin-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    font-family:Arial,sans-serif;
}

.admin-form textarea{
    min-height:180px;
    resize:vertical;
}

.post-admin{
    background:#fff;
    border:1px solid #ddd;
    padding:20px;
    margin-bottom:15px;
    overflow-wrap:anywhere;
}

.post-admin h3{
    margin-bottom:8px;
}

.post-admin p{
    color:#666;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.post-actions{
    margin-top:15px;
}

.danger{
    background:#b42318;
    color:#fff;
}

.danger:hover{
    background:#8f1c13;
}

.error{
    color:#b42318;
    margin-bottom:15px;
}
.audit-section {
    margin-top: 40px;
    margin-bottom: 40px;
}

.audit-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.audit-heading h2 {
    font-size: clamp(22px, 4vw, 30px);
}

.audit-message {
    margin-bottom: 12px;
    color: #666;
}

.audit-table-wrap {
    width: 100%;
    overflow-x: auto;
    background: #fff;
    border: 1px solid #ddd;
}

.audit-table {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    font-size: 14px;
}

.audit-table th,
.audit-table td {
    padding: 12px;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid #ddd;
    overflow-wrap: anywhere;
}

.audit-table th {
    background: #f3f3f3;
    font-weight: bold;
}

.audit-table tr:last-child td {
    border-bottom: none;
}

@media (max-width: 480px) {
    .audit-heading {
        align-items: flex-start;
        flex-direction: column;
    }

    .audit-heading button {
        width: 100%;
    }
}

@media (max-width:768px){

    .admin-page{
        width:92%;
        margin:30px auto;
    }

    .admin-form{
        padding:20px;
        margin-bottom:25px;
    }

    .admin-form textarea{
        min-height:150px;
    }

    .post-admin{
        padding:15px;
    }

}

@media (max-width:480px){

    .admin-page{
        width:94%;
        margin:20px auto;
    }

    .admin-form{
        padding:15px;
    }

    .admin-form input,
    .admin-form textarea{
        font-size:16px;
    }

    .post-actions button{
        width:100%;
    }

}
</style>
</head>
<body>

<header>
    <div class="logo">DS</div>
    <nav>
        <a href="index.html">Главная</a>
        <a href="last_upd.html">Последние нововведения</a>
        <a href="current_work.html">Текущий этап разработки</a>
    </nav>
</header>

<main class="admin-page" id="adminPage">
    <div class="admin-form">
        <h1>Создание нововведения</h1>
        <p id="error" class="error"></p>

        <input id="title" type="text" placeholder="Заголовок">
        <textarea id="content" placeholder="Текст нововведения"></textarea>

        <button class="dark" onclick="createPost()">Опубликовать</button>
    </div>

    <h2>Опубликованные посты</h2>
    <div id="adminPosts"></div>
    <section class="audit-section">
        <div class="audit-heading">
            <h2>Журнал аудита</h2>
            <button class="light" onclick="loadAuditLogs()">
                Обновить
            </button>
        </div>

        <p id="auditMessage" class="audit-message"></p>

        <div id="auditLogs">
            Загрузка журнала...
        </div>
    </section>
</main>

<script src="auth.js"></script>
<script>
async function initAdmin() {

    const user = await currentUser();

    if (!user || user.role !== "admin") {
        document.getElementById("adminPage").innerHTML = `
            <h1>Доступ запрещен</h1>
            <p>Эта страница доступна только администраторам.</p>
        `;
        return;
    }

    loadAdminPosts();
}

async function createPost() {

    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const error = document.getElementById("error");

    error.textContent = "";

    if (!title || !content) {
        error.textContent = "Заполните оба поля.";
        return;
    }

    const response = await fetch("/api/posts", {
        method:"POST",
        credentials:"include",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({title,content})
    });

    const data = await response.json();

    if (!response.ok) {
        error.textContent = data.message || "Ошибка создания поста.";
        return;
    }

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";

    loadAdminPosts();
}

async function loadAdminPosts() {

    const response = await fetch("/api/posts", {cache:"no-store"});
    const posts = await response.json();
    const container = document.getElementById("adminPosts");

    if (posts.length === 0) {
        container.innerHTML = "<p>Постов пока нет.</p>";
        return;
    }

    container.innerHTML = posts.map(post => `
        <article class="post-admin">
            <h3>${escapeHtml(post.title)}</h3>
            <p>${escapeHtml(post.content)}</p>
            <div class="post-actions">
                <button class="danger" onclick="deletePost(${post.id})">Удалить</button>
            </div>
        </article>
    `).join("");
}


async function loadAuditLogs() {
    const container = document.getElementById("auditLogs");
    const message = document.getElementById("auditMessage");

    message.textContent = "";
    container.textContent = "Загрузка журнала...";

    try {
        const response = await fetch("/api/audit-logs", {
            credentials: "include",
            cache: "no-store"
        });

        if (!response.ok) {
            container.textContent = "Не удалось загрузить журнал.";
            return;
        }

        const logs = await response.json();

        if (!Array.isArray(logs) || logs.length === 0) {
            container.textContent = "Записей пока нет.";
            return;
        }

        const actionLabels = {
            registration_success: "Регистрация",
            registration_failed: "Ошибка регистрации",
            login_success: "Успешный вход",
            login_failed: "Неудачный вход",
            logout: "Выход",
            post_created: "Создание публикации",
            post_deleted: "Удаление публикации",
            auth_failed: "Ошибка авторизации",
            access_denied: "Отказ в доступе"
        };

        container.innerHTML = `
            <div class="audit-table-wrap">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>Дата и время</th>
                            <th>Пользователь</th>
                            <th>Действие</th>
                            <th>Подробности</th>
                            <th>IP-адрес</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${logs.map(log => {
                            const date = log.created_at
                                ? new Date(
                                    log.created_at.replace(" ", "T") + "Z"
                                ).toLocaleString("ru-RU")
                                : "—";

                            return `
                                <tr>
                                    <td>${escapeHtml(date)}</td>
                                    <td>${escapeHtml(log.username || "—")}</td>
                                    <td>${escapeHtml(
                                        actionLabels[log.action] || log.action
                                    )}</td>
                                    <td>${escapeHtml(log.details || "—")}</td>
                                    <td>${escapeHtml(log.ip || "—")}</td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>
        `;
    } catch (error) {
        console.error("Ошибка загрузки журнала:", error);
        container.textContent = "Ошибка соединения с сервером.";
    }
}

async function deletePost(id) {

    if (!confirm("Удалить этот пост?"))
        return;

    const response = await fetch(`/api/posts/${id}`, {
        method:"DELETE",
        credentials:"include"
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.message || "Ошибка удаления");
        return;
    }

    loadAdminPosts();
    loadAuditLogs();
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

initAdmin();

</script>
</body>
</html>
