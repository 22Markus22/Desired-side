<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вход</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    background:#fafafa;
}

.auth-box{
    width:min(100%, 420px);
    padding:clamp(24px, 6vw, 40px);
    background:white;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.auth-box h1{
    margin-bottom:25px;
    text-align:center;
    font-size:clamp(28px, 7vw, 36px);
}

.auth-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:16px;
    outline:none;
}

.auth-box input:focus{
    border-color:#2196f3;
}

.auth-box button{
    width:100%;
    padding:12px;
    font-size:16px;
}

.auth-box p{
    text-align:center;
    margin-top:15px;
}

.auth-box a{
    color:#2196f3;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="auth-box">

<h1>Вход</h1>

<input
id="username"
placeholder="Имя Пользователя"
type="text">

<input
id="password"
placeholder="Пароль"
type="password">

<button
class="dark"
onclick="login()">

Войти

</button>

<p>

<a href="register.html">

Создать аккаунт

</a>

</p>

</div>

<script src="auth.js"></script>

</body>
</html>
