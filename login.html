<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вход</title>

<link rel="stylesheet" href="style.css">

<style>

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#fafafa;

}

.auth-box{

width:420px;
padding:40px;
background:white;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.1);

}

input{

width:100%;
padding:12px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ddd;

}

button{

width:100%;
padding:12px;

}

h1{

margin-bottom:25px;
text-align:center;

}

</style>

</head>
<body>

<div class="auth-box">

<h1>Вход</h1>

<input
id="email"
placeholder="Email"
type="email">

<input
id="password"
placeholder="Пароль"
type="password">

<button
class="dark"
onclick="login()">

Войти

</button>

<p>

<a href="register.html">

Создать аккаунт

</a>

</p>

</div>

<script src="auth.js"></script>

</body>
</html>
