<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        background:#fafafa;
    }

    .auth-box{
        width:420px;
        background:#fff;
        padding:40px;
        border-radius:12px;
        box-shadow:0 0 15px rgba(0,0,0,.1);
    }

    .auth-box h1{
        text-align:center;
        margin-bottom:25px;
    }

    .auth-box input{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border:1px solid #ddd;
        border-radius:8px;
        font-size:16px;
        outline:none;
        transition:border-color .2s;
    }

    .auth-box input:focus{
        border-color:#2196f3;
    }

    .auth-box button{
        width:100%;
        padding:12px;
        font-size:16px;
    }

    .auth-box p{
        text-align:center;
        margin-top:15px;
    }

    .auth-box a{
        color:#2196f3;
        text-decoration:none;
    }

    .auth-box a:hover{
        text-decoration:underline;
    }
</style>

<body>
    <div class="auth-box">
        <h1>Регистрация</h1>

        <input
            id="username"
            type="text"
            placeholder="Логин"
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
        >

        <button class="dark" onclick="register()">
            Зарегистрироваться
        </button>

        <p>
            Уже есть аккаунт?
            <a href="login.html" style="color: coral">
                Войти
            </a>
        </p>
    </div>
    <script src="auth.js"></script>
</body>

</html>
